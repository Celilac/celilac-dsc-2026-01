services:
  postgres:
    image: postgres:16
    container_name: celillac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: celillac
      POSTGRES_PASSWORD: celillac
      POSTGRES_DB: celillac_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
