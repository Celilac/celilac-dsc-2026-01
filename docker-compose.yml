services:
  postgres:
    image: postgres:16
    container_name: agenda-facil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-agendafacil}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agendafacil}
      POSTGRES_DB: ${DB_DATABASE:-agendafacil_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agenda-facil-net

  backend:
    build: ./agenda-facil-backend
    container_name: agenda-facil-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-agendafacil}
      - DB_PASSWORD=${DB_PASSWORD:-agendafacil}
      - DB_DATABASE=${DB_DATABASE:-agendafacil_db}
      - JWT_SECRET=${JWT_SECRET:-agenda-facil-dev-secret}
    depends_on:
      - postgres
    networks:
      - agenda-facil-net

  frontend:
    build:
      context: ./agenda-facil-frontend
      dockerfile: Dockerfile.dev
    container_name: agenda-facil-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
    volumes:
      - ./agenda-facil-frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - agenda-facil-net

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  agenda-facil-net:
    driver: bridge
