name: CI

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

jobs:
  backend-unit:
    name: Backend – Testes Unitários
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celillac-backend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: celillac-backend/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --max-warnings=0

      - name: Testes unitários
        run: pnpm test:cov

      - name: Upload cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: celillac-backend/coverage/

  backend-e2e:
    name: Backend – Testes E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celillac-backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: celillac
          POSTGRES_PASSWORD: celillac
          POSTGRES_DB: celillac_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3002
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: celillac
      DB_PASSWORD: celillac
      DB_DATABASE: celillac_db
      JWT_SECRET: ci-secret-key-com-mais-de-32-caracteres-ok
      JWT_EXPIRATION: 1d

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: celillac-backend/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testes E2E
        run: pnpm test:e2e

  frontend:
    name: Frontend – Lint e Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celillac-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: celillac-frontend/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  docker-build:
    name: Docker – Build e Publicar imagem do backend
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-e2e]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/celillac-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: ./celillac-backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
